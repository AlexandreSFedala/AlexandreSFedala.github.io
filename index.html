<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alexandre S. Fedala | Portfolio</title>
    <meta name="description" content="Portfolio of Alexandre S. Fedala - Civil Engineering Student & Developer">

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Lato:wght@300;400;700&display=swap" rel="stylesheet">

    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.4.1/dist/MarkerCluster.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.4.1/dist/MarkerCluster.Default.css" />

    <!-- Main Styles -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body data-theme="light">

    <!-- Navigation -->
    <nav class="navbar">
        <div class="nav-brand" data-key="name">Alexandre S. Fedala</div>
        <div class="nav-controls">
            <button id="theme-toggle" aria-label="Toggle Theme">
                <span class="icon">◑</span>
            </button>
            <div class="lang-switch">
                <button data-lang="en" class="active">EN</button>
                <button data-lang="fr">FR</button>
            </div>
        </div>
    </nav>

    <main>
        <!-- Hero Section -->
        <section class="hero">
            <div class="hero-inner">
                <h1 class="hero-title" data-key="name">Alexandre S. Fedala</h1>
                <p class="hero-subtitle" data-key="jobTitle">Undergraduate Civil Engineering Student</p>
                <div class="hero-actions">
                    <a href="pdfs/CV.pdf" target="_blank" class="btn-text" data-key="seeCV">See CV &rarr;</a>
                </div>
            </div>
            <div class="scroll-indicator">
                <span data-key="scrollDown">Scroll Down</span>
                <div class="line"></div>
            </div>
        </section>

        <!-- About Section -->
        <section class="section about" id="about">
            <div class="section-header">
                <h2 data-key="aboutMe">About Me</h2>
                <div class="header-line"></div>
            </div>
            <div class="about-content" id="about-content">
                <!-- Dynamic Content -->
            </div>
        </section>

        <!-- Projects Section -->
        <section class="section projects" id="projects">
            <div class="section-header">
                <h2 data-key="projects">Projects</h2>
                <div class="header-line"></div>
            </div>
            <div id="projects-list" class="projects-list">
                <!-- Dynamic Content (Alternating Rows) -->
            </div>
            <div class="map-cta-container">
                <button id="open-map-btn" class="btn-outline" data-key="seeOnMap">View Project Locations</button>
            </div>
        </section>

        <!-- Skills Section -->
        <section class="section skills" id="skills">
            <div class="section-header">
                <h2 data-key="skills">Skills</h2>
                <div class="header-line"></div>
            </div>
            <div id="skills-container" class="skills-grid">
                <!-- Dynamic Content -->
            </div>
        </section>

        <!-- Footer / Contact -->
        <footer class="footer">
            <h2 data-key="contactMe">Contact Me</h2>
            <div class="footer-links">
                <a href="mailto:alexandrefedala.afedala@gmail.com" class="footer-link">Email</a>
                <a href="https://www.linkedin.com/in/afedala/" target="_blank" class="footer-link">LinkedIn</a>
                <a href="https://wa.me/447927708325" target="_blank" class="footer-link">WhatsApp</a>
            </div>
            <div class="copyright">
                &copy; <span id="year"></span> Alexandre S. Fedala
            </div>
        </footer>
    </main>

    <!-- Project Modal -->
    <dialog id="project-modal" class="modal">
        <div class="modal-content">
            <button class="close-modal">&times;</button>
            <div id="project-modal-body"></div>
        </div>
    </dialog>

    <!-- Map Modal -->
    <dialog id="map-modal" class="modal full-screen">
        <button class="close-modal">&times;</button>
        <div id="map-container"></div>
    </dialog>

    <!-- Scripts -->
    <script src="texts.js"></script>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    <script src="https://unpkg.com/leaflet.markercluster@1.4.1/dist/leaflet.markercluster.js"></script>
    <script type="module" src="js/app.js"></script>
</body>
</html>
