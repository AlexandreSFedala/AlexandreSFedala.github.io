<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alexandre S. Fedala | Portfolio</title>
    <meta name="description" content="Portfolio of Alexandre S. Fedala - Civil Engineering Student & Developer">

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.4.1/dist/MarkerCluster.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.4.1/dist/MarkerCluster.Default.css" />

    <!-- Main Styles -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body data-theme="light">

    <!-- Language & Theme Controls (Floating or Fixed) -->
    <div class="controls">
        <button id="theme-toggle" aria-label="Toggle Theme">
            <span class="icon sun">☀️</span>
            <span class="icon moon">🌙</span>
        </button>
        <div class="lang-switch">
            <button data-lang="en" class="active">EN</button>
            <button data-lang="fr">FR</button>
        </div>
    </div>

    <main class="bento-grid">
        <!-- Hero Section -->
        <article class="card hero" id="card-hero">
            <div class="hero-content">
                <img src="images/logo.png" alt="Profile" class="profile-img">
                <div>
                    <h1 data-key="name">Alexandre S. Fedala</h1>
                    <h2 data-key="jobTitle">Undergraduate Civil Engineering Student</h2>
                    <p data-key="heroIntro">Welcome to my portfolio.</p>
                </div>
            </div>
            <div class="hero-actions">
                <a href="pdfs/CV.pdf" target="_blank" class="btn" data-key="seeCV">See CV</a>
                <a href="mailto:alexandrefedala.afedala@gmail.com" class="btn secondary" data-key="contactMe">Contact</a>
            </div>
        </article>

        <!-- About Me -->
        <article class="card about" id="card-about">
            <h3 data-key="aboutMe">About Me</h3>
            <div id="about-content" class="scrollable-content">
                <!-- Dynamic Content -->
            </div>
        </article>

        <!-- Skills -->
        <article class="card skills" id="card-skills">
            <h3 data-key="skills">Skills</h3>
            <div id="skills-container" class="tags-container">
                <!-- Dynamic Content -->
            </div>
        </article>

        <!-- Map / Location -->
        <article class="card map-card" id="card-map">
            <h3 data-key="location">Location</h3>
            <div class="map-preview">
                <div class="map-overlay">
                    <span data-key="seeOnMap">See Projects on Map</span>
                </div>
            </div>
        </article>

        <!-- Projects -->
        <article class="card projects" id="card-projects">
            <h3 data-key="projects">Projects</h3>
            <div id="projects-list" class="projects-grid-mini">
                <!-- Dynamic Content -->
            </div>
        </article>

        <!-- Socials -->
        <article class="card social" id="card-social">
            <a href="https://www.linkedin.com/in/afedala/" target="_blank" class="social-link linkedin">
                <img src="images/linkedin-app-white-icon.png" alt="LinkedIn">
            </a>
            <a href="https://wa.me/447927708325" target="_blank" class="social-link whatsapp">
                <img src="images/whatsapp-white-icon.png" alt="WhatsApp">
            </a>
            <a href="mailto:alexandrefedala.afedala@gmail.com" class="social-link email">
                <img src="images/email-envelope-white-icon.png" alt="Email">
            </a>
        </article>
    </main>

    <!-- Modals -->
    <dialog id="project-modal" class="modal">
        <div class="modal-content">
            <button class="close-modal">&times;</button>
            <div id="project-modal-body"></div>
        </div>
    </dialog>

    <dialog id="map-modal" class="modal full-screen">
        <button class="close-modal">&times;</button>
        <div id="map-container"></div>
    </dialog>

    <!-- Scripts -->
    <script src="texts.js"></script>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    <script src="https://unpkg.com/leaflet.markercluster@1.4.1/dist/leaflet.markercluster.js"></script>
    <script type="module" src="js/app.js"></script>
</body>
</html>
