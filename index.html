<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Portfolio for Alexandre S. Fedala, an undergraduate civil engineering student at University College London.">
    <title>Alexandre S. Fedala | Portfolio</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="loader/loader.css">
    <link rel="icon" type="image/x-icon" href="images/favicon.ico">
    <link href="https://fonts.googleapis.com/css?family=Montserrat:700,900&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css?family=Open+Sans:400,600&display=swap" rel="stylesheet">
</head>
<body class="loading">

<div id="loader-overlay">
  <div class="loader-symbols"></div>
  <div id="click-prompt" class="hidden">
    <div class="language-selection">
        <button class="language-button" data-lang="en">
    <img src="images/uk_flag.svg" alt="UK Flag" class="flag-icon"> English
        </button>
        <button class="language-button" data-lang="fr">
    <img src="images/french_flag.svg" alt="French Flag" class="flag-icon"> Français
        </button>
    </div>
  </div>
</div>

<div id="main-website-content" class="hidden">
    <nav id="navbar">
      <div class="nav-left">
        <div class="logo-container">
          <div class="nav-blue-circle"></div>
          <a href="#" class="logo"><img src="images/logo.png" alt="Alexandre S. Fedala Portfolio Logo" class="nav-logo"></a>
        </div>
        <div id="music-player-container">
            <button id="play-pause-btn" aria-label="Play Music">
                <svg id="play-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
                <svg id="pause-icon" class="hidden" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
            </button>
            <canvas id="audio-visualizer"></canvas>
        </div>
      </div>
      <div class="nav-right">
        <div class="social-links">
            <a href="https://wa.me/447927708325" target="_blank" aria-label="WhatsApp"><img src="images/whatsapp-white-icon.png" alt="WhatsApp Icon" width="20" height="20"></a>
            <a href="https://www.linkedin.com/in/afedala/" target="_blank" aria-label="LinkedIn"><img src="images/linkedin-app-white-icon.png" alt="LinkedIn Icon" width="20" height="20"></a>
            <a href="mailto:alexandrefedala.afedala@gmail.com" aria-label="Email"><img src="images/email-envelope-white-icon.png" alt="Email Icon" width="20" height="20"></a>
        </div>
      </div>
    </nav>

    <header>
        <div id="particles-js" aria-hidden="true"></div>
        <h1>An Undergraduate Portfolio</h1>
        <p>by Alexandre S. Fedala</p>
        <div id="cv-cta-container">
            <a href="pdfs/CV.pdf" target="_blank" class="cv-arrow" data-lang-key="seeCV">See CV <span>&rarr;</span></a>
        </div>
    </header>

    <div class="scroll-down-indicator">
        <span class="scroll-text" data-lang-key="scrollDown">Scroll Down</span>
        <a href="#main-content" class="scroll-arrow">&#x2193;</a>
    </div>

    <main class="main-columns" id="main-content">
        <section class="column aboutme">
          <h2 data-lang-key="aboutMe">About Me</h2>
          <div class="column-content">
            <div id="about-me-text"></div>
            <div class="certifications-section">
              <h3 class="certifications-title" data-lang-key="certificationsTitle">Certifications</h3>
              <div class="certifications-list">
                <!-- Certifications will be dynamically loaded here -->
              </div>
            </div>
          </div>
        </section>

        <section class="column skills">
            <h2 data-lang-key="skills">Skills</h2>
            <div class="column-content">
                <!-- Skills will be dynamically loaded here -->
            </div>
        </section>

        <section class="column projects">
            <h2 data-lang-key="projects">Projects</h2>
            <div class="subpages">
                <!-- Project subpages will be dynamically loaded here -->
            </div>
            <!-- Project details will be dynamically loaded here -->
        </section>
    </main>
</div>

<audio id="background-audio" src="sounds/background-music.mp3" loop></audio>

<script src="https://cdn.jsdelivr.net/particles.js/2.0.0/particles.min.js"></script>
<script src="particles-init.js"></script>
<script src="data/projects.js"></script>
<script src="data/skills.js"></script>
<script src="data/certifications.js"></script>
<script src="texts.js"></script>
<script src="js/main.js"></script>
<script src="loader/loader.js"></script>
<script src="script.js"></script>
<script src="visualizer.js"></script>

</body>
</html>
