<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alexandre S. Fedala | Portfolio</title>
    <meta name="description" content="Portfolio of Alexandre S. Fedala - Civil Engineering Student & Developer">

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Fraunces:opsz,wght@9..144,300;9..144,600;9..144,700&display=swap" rel="stylesheet">

    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.4.1/dist/MarkerCluster.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.4.1/dist/MarkerCluster.Default.css" />

    <!-- Main Styles -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body data-theme="light">

    <div class="split-layout">

        <!-- Left Panel: Identity & Nav -->
        <aside class="left-panel">
            <div class="identity-container">
                <div class="logo-area">
                    <img src="images/logo.png" alt="Profile" class="profile-img">
                </div>
                <h1 class="name" data-key="name">Alexandre S. Fedala</h1>
                <h2 class="role" data-key="jobTitle">Undergraduate Civil Engineering Student</h2>
                <p class="tagline" data-key="heroIntro">Welcome to my portfolio.</p>

                <nav class="main-nav">
                    <a href="#about" class="nav-item active" data-key="aboutMe">About Me</a>
                    <a href="#timeline" class="nav-item" data-key="education">Education</a>
                    <a href="#projects" class="nav-item" data-key="projects">Projects</a>
                    <a href="#skills" class="nav-item" data-key="skills">Skills</a>
                </nav>

                <div class="left-footer">
                    <div class="social-row">
                        <a href="mailto:alexandrefedala.afedala@gmail.com" aria-label="Email"><img src="images/email-envelope-white-icon.png" class="social-icon"></a>
                        <a href="https://www.linkedin.com/in/afedala/" target="_blank" aria-label="LinkedIn"><img src="images/linkedin-app-white-icon.png" class="social-icon"></a>
                        <a href="https://wa.me/447927708325" target="_blank" aria-label="WhatsApp"><img src="images/whatsapp-white-icon.png" class="social-icon"></a>
                    </div>
                    <div class="controls-row">
                        <button id="theme-toggle" class="control-btn" aria-label="Toggle Theme">
                            <span class="icon">◑</span>
                        </button>
                        <div class="lang-switch">
                            <button data-lang="en" class="active">EN</button>
                            <button data-lang="fr">FR</button>
                        </div>
                    </div>
                </div>
            </div>
        </aside>

        <!-- Right Panel: Content Stream -->
        <main class="right-panel">

            <!-- About Section -->
            <section id="about" class="content-section">
                <h3 class="section-title" data-key="aboutMe">About Me</h3>
                <div id="about-content" class="text-block">
                    <!-- Dynamic Bio -->
                </div>
                <div class="cv-container">
                    <a href="pdfs/CV.pdf" target="_blank" class="primary-btn" data-key="seeCV">Download CV</a>
                </div>
            </section>

            <!-- Timeline / Education -->
            <section id="timeline" class="content-section">
                <h3 class="section-title" data-key="education">Education</h3>
                <div id="timeline-content" class="timeline-container">
                    <!-- Dynamic Education/Exp -->
                </div>
            </section>

            <!-- Projects Section -->
            <section id="projects" class="content-section">
                <h3 class="section-title" data-key="projects">Projects</h3>
                <div id="projects-list" class="projects-grid">
                    <!-- Dynamic Projects -->
                </div>
                <div class="map-cta">
                    <button id="open-map-btn" class="secondary-btn" data-key="seeOnMap">View Locations Map</button>
                </div>
            </section>

            <!-- Skills Section -->
            <section id="skills" class="content-section">
                <h3 class="section-title" data-key="skills">Skills</h3>
                <div id="skills-container" class="skills-wrapper">
                    <!-- Dynamic Skills -->
                </div>
            </section>

            <!-- Certifications (appended to bottom) -->
             <section id="certs" class="content-section">
                <h3 class="section-title" data-key="certifications">Certifications</h3>
                <div id="certs-container" class="certs-grid">
                    <!-- Dynamic Certs -->
                </div>
            </section>

            <footer class="stream-footer">
                <p>&copy; <span id="year"></span> Alexandre S. Fedala</p>
            </footer>

        </main>
    </div>

    <!-- Modals -->
    <dialog id="project-modal" class="modal">
        <div class="modal-content">
            <button class="close-modal">&times;</button>
            <div id="project-modal-body"></div>
        </div>
    </dialog>

    <dialog id="map-modal" class="modal full-screen">
        <button class="close-modal">&times;</button>
        <div id="map-container"></div>
    </dialog>

    <!-- Scripts -->
    <script src="texts.js"></script>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    <script src="https://unpkg.com/leaflet.markercluster@1.4.1/dist/leaflet.markercluster.js"></script>
    <script type="module" src="js/app.js"></script>
</body>
</html>
