<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alexandre S. Fedala | Portfolio</title>
    <meta name="description" content="Portfolio of Alexandre S. Fedala - Civil Engineering Student & Developer">

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lato:wght@300;400;700&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">

    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.4.1/dist/MarkerCluster.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.4.1/dist/MarkerCluster.Default.css" />

    <!-- Main Styles -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body data-theme="light">

    <!-- Fixed Header -->
    <header class="site-header">
        <a href="#hero" class="brand" data-key="name">Alexandre S. Fedala</a>
        <div class="header-controls">
            <nav class="desktop-nav">
                <a href="#about" class="nav-link" data-key="aboutMe">About</a>
                <a href="#projects" class="nav-link" data-key="projects">Projects</a>
                <a href="#skills" class="nav-link" data-key="skills">Skills</a>
            </nav>
            <div class="sep"></div>
            <button id="theme-toggle" class="icon-btn" aria-label="Toggle Theme">
                <svg class="icon sun" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"></path></svg>
                <svg class="icon moon" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"></path></svg>
            </button>
            <div class="lang-switch">
                <button data-lang="en" class="active">EN</button>
                <button data-lang="fr">FR</button>
            </div>
        </div>
    </header>

    <main>
        <!-- Hero -->
        <section id="hero" class="hero-section">
            <div class="hero-content">
                <div class="hero-label reveal-text" data-key="jobTitle">Undergraduate Civil Engineering Student</div>
                <h1 class="hero-title reveal-text" data-delay="100" data-key="name">Alexandre S. Fedala</h1>
                <div class="hero-actions reveal-text" data-delay="200">
                    <a href="pdfs/CV.pdf" target="_blank" class="btn-architectural" data-key="seeCV">View CV</a>
                </div>
            </div>
            <div class="scroll-line"></div>
        </section>

        <!-- About -->
        <section id="about" class="section">
            <div class="container">
                <div class="section-header reveal-text">
                    <span class="section-num">01</span>
                    <h2 data-key="aboutMe">About Me</h2>
                </div>

                <div class="about-grid">
                    <div class="about-text-col" id="about-content">
                        <!-- Dynamic Bio -->
                    </div>
                    <div class="about-meta-col">
                        <h3 class="meta-title" data-key="education">Education</h3>
                        <div id="timeline-content">
                            <!-- Dynamic Education -->
                        </div>

                        <h3 class="meta-title" data-key="certifications" style="margin-top:40px">Certifications</h3>
                        <div id="certs-content" class="certs-wrapper">
                            <!-- Dynamic Certs -->
                        </div>
                    </div>
                </div>
            </div>
        </section>

        <!-- Projects -->
        <section id="projects" class="section">
            <div class="container">
                <div class="section-header reveal-text">
                    <span class="section-num">02</span>
                    <h2 data-key="projects">Selected Works</h2>
                </div>

                <div id="projects-list" class="projects-stack">
                    <!-- Dynamic Projects -->
                </div>

                <div class="map-cta reveal-text">
                     <button id="open-map-btn" class="btn-architectural" data-key="seeOnMap">View Project Locations</button>
                </div>
            </div>
        </section>

        <!-- Skills -->
        <section id="skills" class="section">
             <div class="container">
                <div class="section-header reveal-text">
                    <span class="section-num">03</span>
                    <h2 data-key="skills">Technical Proficiency</h2>
                </div>
                <div id="skills-container" class="skills-grid reveal-text">
                    <!-- Dynamic Skills -->
                </div>
            </div>
        </section>

        <!-- Footer -->
        <footer class="site-footer">
            <div class="container">
                <div class="footer-content">
                    <div class="footer-col">
                        <h3 data-key="contactMe">Contact</h3>
                        <a href="mailto:alexandrefedala.afedala@gmail.com" class="footer-link">alexandrefedala.afedala@gmail.com</a>
                        <div class="social-row">
                             <a href="https://www.linkedin.com/in/afedala/" target="_blank">LinkedIn</a>
                             <a href="https://wa.me/447927708325" target="_blank">WhatsApp</a>
                        </div>
                    </div>
                    <div class="footer-col right">
                        <p>&copy; <span id="year"></span> Alexandre S. Fedala</p>
                    </div>
                </div>
            </div>
        </footer>

    </main>

    <!-- Project Modal -->
    <dialog id="project-modal" class="modal">
        <button class="close-modal" aria-label="Close">&times;</button>
        <div class="modal-content" id="project-modal-body"></div>
    </dialog>

    <dialog id="map-modal" class="modal full-screen">
        <button class="close-modal" aria-label="Close">&times;</button>
        <div id="map-container"></div>
    </dialog>

    <!-- Scripts -->
    <script src="texts.js"></script>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    <script src="https://unpkg.com/leaflet.markercluster@1.4.1/dist/leaflet.markercluster.js"></script>
    <script type="module" src="js/app.js"></script>
</body>
</html>
